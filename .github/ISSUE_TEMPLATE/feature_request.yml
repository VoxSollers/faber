name: Feature request
description: New functionality or enhancement
title: "feat: "
labels: ["type:feat", "priority:p2"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area:auth
        - area:resumes
        - area:users
        - area:identity
        - area:notifications
        - area:vault
        - area:infra
        - area:ui-shared
        - area:ux
        - area:tests-infra
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What need or pain is this solving?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional notes / mockups / links
