name: Bug report
description: Something is broken or behaves incorrectly
title: "fix: "
labels: ["type:fix", "priority:p2"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system is affected?
      options:
        - area:auth
        - area:resumes
        - area:users
        - area:identity
        - area:notifications
        - area:vault
        - area:infra
        - area:ui-shared
        - area:ux
        - area:tests-infra
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Browser / .NET SDK:
        - Branch / commit:
