name: Refactor
description: Internal change without altering behavior
title: "refactor: "
labels: ["type:refactor", "priority:p3"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - area:auth
        - area:resumes
        - area:users
        - area:identity
        - area:notifications
        - area:vault
        - area:infra
        - area:ui-shared
        - area:ux
        - area:tests-infra
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this refactor needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which files/modules will be touched?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk / regression surface
