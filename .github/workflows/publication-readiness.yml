name: Publication Readiness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publication-readiness:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      TRUFFLEHOG_VERSION: 3.97.4
      TRUFFLEHOG_SHA256: dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b

    steps:
      - name: Checkout tracked snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify third-party notices
        run: bash scripts/verify-third-party-notices.sh

      - name: Install pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          install -d "${RUNNER_TEMP}/secret-scanners"

          curl -fsSLo "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/secret-scanners" gitleaks

          curl -fsSLo "${RUNNER_TEMP}/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${RUNNER_TEMP}/trufflehog.tar.gz" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/trufflehog.tar.gz" -C "${RUNNER_TEMP}/secret-scanners" trufflehog

          echo "${RUNNER_TEMP}/secret-scanners" >> "${GITHUB_PATH}"

      # This deliberately scans a tracked-files export, not the known private
      # repository history. Scanner output is retained only in a runner temp
      # directory so a finding can never print a credential value to the log.
      - name: Scan tracked snapshot
        run: bash scripts/verify-public-snapshot.sh --preflight
