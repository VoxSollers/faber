<div class="max-w-lg mx-auto mt-10 px-4">
  <h1 class="font-serif text-2xl font-bold text-foreground mb-6">Account</h1>

  <div class="bg-card border-[0.5px] border-line rounded-xl p-6 flex flex-col gap-4">

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-muted-foreground">Username</span>
      <span class="text-foreground">{{ user()?.username }}</span>
    </div>

    <div class="flex flex-col gap-1">
      <span class="text-sm font-medium text-muted-foreground">Email</span>
      <span class="text-foreground">{{ user()?.email }}</span>
    </div>

    <hr class="border-line" />

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <fb-input formControlName="firstName" label="First name" autocomplete="given-name" />

      <fb-input formControlName="lastName" label="Last name" autocomplete="family-name" />

      <div class="flex justify-end">
        <button
          type="submit"
          [disabled]="loading()"
          [attr.aria-busy]="loading()"
          [attr.aria-label]="loading() ? 'Saving' : 'Save profile'"
          fb-button variant="primary" class="w-28">
          @if (loading()) {
            <span
              class="h-4 w-4 inline-block animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
              aria-hidden="true"></span>
          } @else {
            <span>Save</span>
          }
        </button>
      </div>

    </form>
  </div>
</div>

<fb-toast
  [message]="saved() ? 'Profile updated successfully.' : null"
  variant="success"
  (dismissed)="saved.set(false)" />
<fb-toast
  [message]="error()"
  variant="error"
  (dismissed)="error.set(null)" />
