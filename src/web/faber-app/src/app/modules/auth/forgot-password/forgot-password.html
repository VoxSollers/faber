<fb-auth-card aria-label="Reset your password">
  <header class="relative mb-8 flex w-full flex-col items-start gap-2.5 text-left">
    <div class="flex w-full items-center justify-between">
      <span class="font-serif text-4xl font-bold text-foreground">Forgot password?</span>
      <div class="flex items-center gap-1.5">
        <fb-theme-toggle />
        <a fb-icon-button intent="surface" size="lg" routerLink="/" aria-label="Go to home page">
          <lucide-icon name="x" [size]="18" [strokeWidth]="2" aria-hidden="true" />
        </a>
      </div>
    </div>
    <p class="max-w-[34ch] text-[0.96rem] leading-relaxed text-muted-foreground">
      Enter your email and we'll send you a reset link.
    </p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
    <fb-input formControlName="email" label="Email address"
              placeholder="john@example.com" autocomplete="email" type="email" />

    <button
      fb-button
      variant="primary"
      size="lg"
      type="submit"
      [disabled]="loading()"
      class="w-full font-bold tracking-[0.01em]">
      @if (loading()) {
        <span class="inline-block h-4 w-4 animate-spin rounded-full border-2 border-solid border-current border-e-transparent"
              role="status" aria-label="Loading"></span>
      } @else {
        Send reset link
      }
    </button>
  </form>
</fb-auth-card>

<fb-toast
  [message]="sent() ? 'Check your email for reset instructions.' : null"
  variant="info"
  (dismissed)="sent.set(false)" />
<fb-toast
  [message]="error() ? 'Something went wrong. Try again later.' : null"
  variant="error"
  (dismissed)="error.set(false)" />
