<app-orderable-list
  [items]="store.educations()"
  [hideTitle]="true"
  title="Education"
  addLabel="Add education"
  [titleFn]="educationTitle"
  (add)="store.addEducation()"
  (delete)="store.deleteEducation($event)"
  (itemDrop)="store.reorderEducations($event)">
  <ng-template let-item>
    <form [formGroup]="getForm(item)" class="flex flex-col gap-3 py-2">
      <!-- focusin/focusout drive the accordion-title focus latch (see
           EntryTitles) so tabbing School -> Degree doesn't flash "Untitled"
           between the two fields' blur/focus events. -->
      <div
        class="grid grid-cols-[repeat(auto-fit,minmax(11rem,1fr))] gap-3"
        (focusin)="onTitleFocusIn(item)"
        (focusout)="onTitleFocusOut(item, $event)">
        <fb-field label="School" placeholder="e.g. University of Oxford" formControlName="school" />
        <fb-field label="Degree" placeholder="e.g. BSc Computer Science" formControlName="degree" />
      </div>
      <!-- @container here (not on an ancestor) so the range below matches this
           row's own width with no padding to account for. minmax(9rem,1fr) +
           gap-3 puts exactly 2 columns in [300px, 456px) — City alone in row
           2 with the second track empty beside it — so City spans both
           columns only in that window; outside it, it's full-width at 1
           column or gets its own column at 3, same as Start/End. -->
      <div class="grid grid-cols-[repeat(auto-fit,minmax(9rem,1fr))] gap-3 @container">
        <fb-date-picker
          label="Start date"
          precision="month"
          [locale]="store.localization()"
          formControlName="startDate" />
        <fb-date-picker
          label="End date"
          precision="month"
          [allowPresent]="true"
          [locale]="store.localization()"
          formControlName="endDate" />
        <fb-field
          label="City"
          placeholder="e.g. Oxford"
          class="@[300px]:@max-[455px]:col-span-2"
          formControlName="city" />
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-muted-foreground">Description</span>
        <fb-rich-text formControlName="description" placeholder="Describe your studies…" />
      </div>
    </form>
  </ng-template>
</app-orderable-list>
