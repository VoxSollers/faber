<app-orderable-list
  [items]="store.courses()"
  [hideTitle]="true"
  title="Courses"
  addLabel="Add course"
  [titleFn]="courseTitle"
  (add)="store.addCourse()"
  (delete)="store.deleteCourse($event)"
  (itemDrop)="store.reorderCourses($event)">
  <ng-template let-item>
    <form [formGroup]="getForm(item)" class="flex flex-col gap-3 py-2">
      <!-- focusin/focusout drive the accordion-title focus latch (see
           EntryTitles) so tabbing Course name -> Institution doesn't flash
           "Untitled" between the two fields' blur/focus events. -->
      <div
        class="grid grid-cols-[repeat(auto-fit,minmax(11rem,1fr))] gap-3"
        (focusin)="onTitleFocusIn(item)"
        (focusout)="onTitleFocusOut(item, $event)">
        <fb-field label="Course name" placeholder="e.g. Advanced React" formControlName="name" />
        <fb-field label="Institution" placeholder="e.g. Frontend Masters" formControlName="school" />
      </div>
      <div class="grid grid-cols-[repeat(auto-fit,minmax(9rem,1fr))] gap-3">
        <fb-date-picker
          label="Start date"
          precision="month"
          [locale]="store.localization()"
          formControlName="startDate" />
        <fb-date-picker
          label="End date"
          precision="month"
          [allowPresent]="true"
          [locale]="store.localization()"
          formControlName="endDate" />
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="text-sm font-medium text-muted-foreground">Description</span>
        <fb-rich-text formControlName="description" placeholder="Describe what you learned…" />
      </div>
    </form>
  </ng-template>
</app-orderable-list>
