<div class="flex flex-col items-center gap-6 text-center">
  <p class="font-display text-[8rem] font-bold leading-none select-none text-gray-400"
     aria-hidden="true">
    404
  </p>

  <h1 class="-mt-6 font-display text-[2rem] font-bold leading-tight text-foreground">
    Page not found
  </h1>

  <button
    type="button"
    fb-button
    variant="primary"
    size="lg"
    (click)="goBack()">
    <lucide-icon name="arrow-left" [size]="16" [strokeWidth]="2.5" aria-hidden="true" />
    Go back
  </button>
</div>
