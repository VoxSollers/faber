@if (message()) {
  <div
    [class]="containerClass()"
    animate.enter="fb-toast-enter"
    animate.leave="fb-toast-leave"
    [attr.role]="ariaRole()"
    [attr.aria-live]="ariaLive()">
    <lucide-icon [name]="iconName()" [size]="18" [strokeWidth]="2" aria-hidden="true" />
    <span class="text-sm font-medium">{{ message() }}</span>
    <button
      class="inline-flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full transition-opacity hover:opacity-70 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring"
      type="button"
      aria-label="Dismiss"
      (click)="dismiss()">
      <lucide-icon name="x" [size]="15" [strokeWidth]="2.5" aria-hidden="true" />
    </button>
  </div>
}
