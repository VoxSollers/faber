<button
  fb-icon-button
  intent="surface"
  size="lg"
  type="button"
  data-testid="theme-toggle"
  [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  (click)="themeService.toggle()">
  <span class="relative flex h-[19px] w-[19px] items-center justify-center overflow-hidden">
    @if (themeService.isDark()) {
      <lucide-icon
        name="sun"
        [size]="19"
        [strokeWidth]="2.4"
        aria-hidden="true"
        class="absolute inset-0"
        [animate.enter]="animationsReady() ? 'theme-icon-sun-enter' : ''"
        [animate.leave]="animationsReady() ? 'theme-icon-sun-leave' : ''" />
    } @else {
      <lucide-icon
        name="moon"
        [size]="19"
        [strokeWidth]="2.4"
        aria-hidden="true"
        class="absolute inset-0"
        [animate.enter]="animationsReady() ? 'theme-icon-moon-enter' : ''"
        [animate.leave]="animationsReady() ? 'theme-icon-moon-leave' : ''" />
    }
  </span>
</button>
