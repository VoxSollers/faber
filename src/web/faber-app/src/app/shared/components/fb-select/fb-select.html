<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="selectId"
           class="text-sm font-medium transition-colors"
           [class]="labelClasses()">
      {{ label() }}
    </label>
  }

  <select
    [id]="selectId"
    [disabled]="disabled()"
    [attr.aria-describedby]="hint() ? hintId : null"
    (change)="onSelect($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    class="w-full rounded-[10px] border-none bg-input px-3.5 py-2.5 font-[inherit] text-[15px] leading-[1.4] text-foreground outline-none transition-[box-shadow,background-color] focus:bg-card focus:shadow-[inset_0_0_0_1px_color-mix(in_oklab,var(--color-foreground)_22%,transparent),0_1px_2px_rgba(0,0,0,0.05),0_5px_16px_rgba(0,0,0,0.11)] disabled:cursor-not-allowed disabled:opacity-60">
    <option value="" [selected]="!value()">{{ placeholder() }}</option>
    @for (option of options(); track option) {
      <option [value]="option" [selected]="option === value()">{{ option }}</option>
    }
  </select>

  @if (hint()) {
    <span [id]="hintId" class="text-xs text-muted-foreground/70">{{ hint() }}</span>
  }
</div>
