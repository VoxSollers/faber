<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label [for]="inputId"
           class="text-sm font-medium transition-colors"
           [class]="labelClasses()">
      {{ label() }}
    </label>
  }

  <input
    [id]="inputId"
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [disabled]="disabled()"
    [attr.aria-describedby]="hint() ? hintId : null"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    class="w-full rounded-[10px] border-none bg-input px-3.5 py-2.5 font-[inherit] text-[15px] leading-[1.4] text-foreground placeholder:text-muted-foreground/60 outline-none transition-[box-shadow,background-color] focus:bg-card focus:shadow-[inset_0_0_0_1px_color-mix(in_oklab,var(--color-foreground)_22%,transparent),0_1px_2px_rgba(0,0,0,0.05),0_5px_16px_rgba(0,0,0,0.11)] disabled:cursor-not-allowed disabled:opacity-60"
  />

  @if (hint()) {
    <span [id]="hintId" class="text-xs text-muted-foreground/70">{{ hint() }}</span>
  }
</div>
